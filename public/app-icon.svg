<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041f1e"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="ballGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="60%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#tealGrad)" stroke-width="4" stroke-opacity="0.5"/>

  <!-- Stadium Floodlight Beams -->
  <path d="M 0 0 L 160 512 L 80 512 Z" fill="#2dd4bf" opacity="0.05"/>
  <path d="M 512 0 L 352 512 L 432 512 Z" fill="#2dd4bf" opacity="0.05"/>

  <!-- Golden Laurel Wreath / Ring -->
  <circle cx="256" cy="220" r="160" fill="none" stroke="url(#tealGrad)" stroke-width="6" stroke-dasharray="14 10" opacity="0.4"/>
  <circle cx="256" cy="220" r="148" fill="#0f172a" opacity="0.6"/>

  <!-- Cricket Ball with 3D Seam -->
  <g transform="translate(256, 205)">
    <!-- Ball Core -->
    <circle cx="0" cy="0" r="92" fill="url(#ballGrad)" filter="url(#glow)"/>
    <!-- Ball Highlight -->
    <ellipse cx="-32" cy="-35" rx="42" ry="24" transform="rotate(-30, -32, -35)" fill="#ffffff" opacity="0.25"/>
    <!-- Seam Path -->
    <path d="M -80 -45 Q 0 0 80 45" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <path d="M -80 -45 Q 0 0 80 45" fill="none" stroke="#fef08a" stroke-width="2" stroke-dasharray="4 6"/>
  </g>

  <!-- Crossed Cricket Bats -->
  <g stroke="#d97706" stroke-width="8" stroke-linecap="round" opacity="0.85">
    <!-- Left Bat Handle -->
    <line x1="160" y1="320" x2="110" y2="370"/>
    <!-- Right Bat Handle -->
    <line x1="352" y1="320" x2="402" y2="370"/>
  </g>

  <!-- Championship Star -->
  <polygon points="256,70 266,95 292,95 271,110 279,135 256,120 233,135 241,110 220,95 246,95" fill="url(#goldGrad)"/>

  <!-- CM26 Typography Banner -->
  <g transform="translate(256, 395)">
    <!-- Pill Backdrop -->
    <rect x="-170" y="-36" width="340" height="72" rx="36" fill="#042f2e" stroke="url(#tealGrad)" stroke-width="3"/>
    <!-- Text Labels -->
    <text x="0" y="4" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-weight="900" font-size="34" fill="#ffffff" letter-spacing="3">CRICKET</text>
    <text x="0" y="30" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-weight="800" font-size="16" fill="url(#goldGrad)" letter-spacing="6">MANAGER 26</text>
  </g>

  <!-- Offline Ready Badge Pill -->
  <g transform="translate(256, 470)">
    <rect x="-80" y="-14" width="160" height="28" rx="14" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="-54" cy="0" r="4" fill="#34d399"/>
    <text x="6" y="5" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-weight="800" font-size="11" fill="#ecfdf5" letter-spacing="1.5">OFFLINE PWA</text>
  </g>
</svg>
