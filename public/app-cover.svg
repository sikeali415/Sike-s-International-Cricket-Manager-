<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021a19"/>
      <stop offset="40%" stop-color="#091428"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="goldCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="tealCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="glowCover" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradCover)"/>

  <!-- Stadium Floodlights Glow Effects -->
  <circle cx="150" cy="80" r="180" fill="#2dd4bf" opacity="0.12" filter="url(#glowCover)"/>
  <circle cx="1050" cy="80" r="180" fill="#eab308" opacity="0.1" filter="url(#glowCover)"/>
  <circle cx="600" cy="315" r="260" fill="#0d9488" opacity="0.15" filter="url(#glowCover)"/>

  <!-- Decorative Pitch & Boundary Oval -->
  <ellipse cx="600" cy="540" rx="550" ry="180" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-opacity="0.25"/>
  <ellipse cx="600" cy="540" rx="380" ry="110" fill="none" stroke="#eab308" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="10 8"/>

  <!-- Left / Center Branding -->
  <g transform="translate(600, 240)">
    <!-- Sub-heading Tag -->
    <rect x="-160" y="-120" width="320" height="42" rx="21" fill="#042f2e" stroke="url(#tealCover)" stroke-width="2"/>
    <text x="0" y="-93" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-weight="900" font-size="16" fill="#2dd4bf" letter-spacing="4">OFFICIAL CHROME PWA &amp; ANDROID APP</text>

    <!-- Main Title -->
    <text x="0" y="-10" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-weight="900" font-size="76" fill="#ffffff" letter-spacing="4">CRICKET MANAGER</text>
    <text x="0" y="70" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-weight="900" font-size="64" fill="url(#goldCover)" letter-spacing="8">26 BETA</text>
  </g>

  <!-- Feature Badges Row -->
  <g transform="translate(600, 430)">
    <!-- Badge 1: 100% Offline -->
    <g transform="translate(-320, 0)">
      <rect x="-100" y="-24" width="200" height="48" rx="24" fill="#0f172a" stroke="#334155" stroke-width="2"/>
      <text x="0" y="7" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-weight="700" font-size="15" fill="#f8fafc">⚡ 100% Offline Play</text>
    </g>
    <!-- Badge 2: Standalone Chrome App -->
    <g transform="translate(-100, 0)">
      <rect x="-100" y="-24" width="200" height="48" rx="24" fill="#0f172a" stroke="#334155" stroke-width="2"/>
      <text x="0" y="7" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-weight="700" font-size="15" fill="#f8fafc">🌐 Chrome App</text>
    </g>
    <!-- Badge 3: Android Installable APK -->
    <g transform="translate(120, 0)">
      <rect x="-100" y="-24" width="200" height="48" rx="24" fill="#0f172a" stroke="#334155" stroke-width="2"/>
      <text x="0" y="7" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-weight="700" font-size="15" fill="#f8fafc">📱 Android Install</text>
    </g>
    <!-- Badge 4: Auto Cloud Sync -->
    <g transform="translate(340, 0)">
      <rect x="-100" y="-24" width="200" height="48" rx="24" fill="#0f172a" stroke="#334155" stroke-width="2"/>
      <text x="0" y="7" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-weight="700" font-size="15" fill="#f8fafc">☁️ Cloud Backup</text>
    </g>
  </g>

  <!-- Bottom Details Bar -->
  <g transform="translate(600, 560)">
    <text x="0" y="0" text-anchor="middle" font-family="'Poppins', system-ui, sans-serif" font-weight="600" font-size="14" fill="#64748b" letter-spacing="2">INTERNATIONAL 4-YEAR CALENDAR • LIVE TACTICAL SIMULATION • FULL SQUAD AUCTION</text>
  </g>
</svg>
